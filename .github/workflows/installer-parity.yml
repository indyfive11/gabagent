name: installer-parity

# Blocking gate (Installer Parity HARD SOP, CLAUDE.md): the installer must never lag the code.
# Runs the automatic parity gates so a drift can't merge silently:
#   Gate 1b — uv.lock is in sync with pyproject (`uv lock --check`)
#   Gate 2  — plugin-installer registry conforms + declared system_pkgs resolve
# Gate 1 (pyproject deps ⊆ AUR PKGBUILD) SKIPS here — the PKGBUILD lives in a separate repo that CI does
# not check out; it is a HARD release-gate at AUR-bump time (run on a box that has the clone).

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/gabagent/config/**'
      - 'src/gabagent/install/**'
      - 'src/gabagent/commands/providers/**'
      - 'src/gabagent/api/factory.py'
      - 'src/gabagent/api/claudette.py'
      - 'src/gabagent/cli.py'
      - 'src/gabagent/slash/commands.py'
      - 'src/gabagent/commands/browser.py'
      - 'tests/unit/test_installer_parity.py'
      - 'tests/unit/test_firstrun_failsoft.py'
      - 'scripts/installer-parity.sh'
      - 'scripts/firstrun_smoke.sh'
      - '.github/workflows/installer-parity.yml'

jobs:
  installer-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # pre-filter derives its delta base from origin/master
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync (dev group)
        run: uv sync --extra dev --inexact   # --inexact: never prune ad-hoc extras (SOP)
      - name: Parity gates (pytest 1/1b/2) + first-run fail-soft (Gate 4)
        run: uv run pytest tests/unit/test_installer_parity.py tests/unit/test_firstrun_failsoft.py -q
      - name: Delta pre-filter (Gate 3)
        run: bash scripts/installer-parity.sh
      - name: First-run fail-soft smoke (Gate 4, real absent package)
        run: bash scripts/firstrun_smoke.sh
