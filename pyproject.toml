[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "gabagent"
version = "0.1.0"
description = "Claude Code reimplementation targeting the Gab AI Developer API"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.55",
    "rich>=13.9",
    "prompt-toolkit>=3.0.48",
    "httpx>=0.27",
    "html2text>=2024.2.26",
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.3",
    "anyio>=4.4",
    "jsonlines>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",
]

[project.scripts]
gabagent = "gabagent.cli:app"
gab = "gabagent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gabagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
