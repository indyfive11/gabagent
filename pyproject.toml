[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "gabagent"
version = "0.6.0"
description = "Claude Code reimplementation targeting the Gab AI Developer API"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.55",
    "anthropic>=0.69",
    "rich>=13.9",
    "prompt-toolkit>=3.0.48",
    "httpx>=0.27",
    "html2text>=2024.2.26",
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.3",
    "anyio>=4.4",
    "jsonlines>=4.0",
    "ddgs>=9.0",
    "playwright>=1.40",
]

[project.optional-dependencies]
voice = [
    "starlette>=0.37",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.scripts]
gabagent = "gabagent.cli:app"
gab = "gabagent.cli:app"
gabagent-install = "gabagent.install.workstation:main"

[tool.hatch.build.targets.wheel]
# installkit is a top-level, app-agnostic subtree (Layer A) shipped alongside gabagent so the installer
# works from a wheel too; it is later vendored into voice-agent at a pinned SHA (import-isolation enforced
# by tests/unit/test_installkit_import_isolation.py).
packages = ["src/gabagent", "installkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
