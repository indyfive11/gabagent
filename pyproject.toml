[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "gabagent"
version = "0.8.2"
description = "Claude Code reimplementation targeting the Gab AI Developer API"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.55",
    "anthropic>=0.69",
    "rich>=13.9",
    "prompt-toolkit>=3.0.48",
    "httpx>=0.27",
    "html2text>=2024.2.26",
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.3",
    "anyio>=4.4",
    "jsonlines>=4.0",
    "ddgs>=9.0",
    "playwright>=1.40",
]

[project.optional-dependencies]
voice = [
    "starlette>=0.37",
    "uvicorn>=0.30",
    "zeroconf>=0.130",  # optional LAN discovery (_voice-brain._tcp); advertiser fail-softs if absent
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.scripts]
gabagent = "gabagent.cli:app"
gab = "gabagent.cli:app"
gabagent-install = "gabagent.install.workstation:main"

[tool.hatch.build.targets.wheel]
# installkit is a top-level, app-agnostic subtree (Layer A) shipped alongside gabagent so the installer
# works from a wheel too; it is later vendored into voice-agent at a pinned SHA (import-isolation enforced
# by tests/unit/test_installkit_import_isolation.py).
packages = ["src/gabagent", "installkit"]

[tool.gabagent.install]
# Installer-parity declared surface (see the Installer Parity HARD SOP in CLAUDE.md).
# `system_pkgs`: non-python OS packages the CORE gabagent package needs at runtime — a shelled-to binary or
# a linked system lib that is NOT a pip dependency, so it cannot be derived from `[dependencies]`. The
# packaging-parity test unions this with the pyproject-derived `python-*` names and asserts the union is
# covered by the AUR PKGBUILD `depends`/`optdepends`. Empty today (gabagent core is pure-python + the
# stdlib-shipped bash); declared here so the moment a non-python dep is added, the gate covers it.
system_pkgs = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
